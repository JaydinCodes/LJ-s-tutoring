name: Temporary Supabase Type Regeneration

on:
  push:
    branches:
      - codex/grade9-term1-assessment-engine

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/grade9-term1-assessment-engine

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: HUSKY=0 npm ci

      - name: Start local Supabase
        run: npm run supabase:start

      - name: Rebuild local database from migrations
        run: npm run supabase:reset

      - name: Regenerate committed Supabase type snapshot
        run: npm run supabase:types:update

      - name: Verify generated type fingerprint
        run: npm run supabase:types:check

      - name: Commit generated types to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/types/public.generated.ts
          if git diff --cached --quiet; then
            echo "Supabase types already match; no commit needed."
            exit 0
          fi
          HUSKY=0 git commit -m "chore: refresh generated Supabase types for assessment engine"
          git push origin HEAD:codex/grade9-term1-assessment-engine
