name: Deploy production

on:
  workflow_run:
    workflows: ["Release Gates"]
    branches: [ main ]
    types: [completed]

# Never overlap deployments. A newer main push cancels its older release gate;
# the SHA assertion below also prevents an already-completed older gate from
# deploying after main has moved.
concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Check out the tested commit for deployment probes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install pinned deployment tooling
        run: HUSKY=0 npm ci

      - name: Confirm main still points at the tested commit
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const testedSha = context.payload.workflow_run.head_sha;
            const { data: main } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            });
            if (main.object.sha !== testedSha) {
              core.setFailed(
                `Refusing deployment: Release Gates tested ${testedSha}, but main is now ${main.object.sha}.`,
              );
            }

      - name: Apply Supabase migrations and Edge Functions for this release
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PRODUCTION_PROJECT_REF: ${{ secrets.SUPABASE_PRODUCTION_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN is required"; exit 1; }
          test -n "$SUPABASE_PRODUCTION_PROJECT_REF" || { echo "SUPABASE_PRODUCTION_PROJECT_REF is required"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "SUPABASE_DB_PASSWORD is required"; exit 1; }
          # db push targets the linked project; unlike functions deploy it does
          # not accept --project-ref. Link explicitly so the target is visible
          # and the ensuing migration push cannot fall back to another project.
          npx supabase link --project-ref "$SUPABASE_PRODUCTION_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          npx supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --include-all --yes
          for function_name in admin-invite-user cleanup-submission-assets dispatch-notification-outbox grade-submission odie-careers-chat-stream process-privacy-deletion refresh-stale-weekly-reports; do
            npx supabase functions deploy "$function_name" --project-ref "$SUPABASE_PRODUCTION_PROJECT_REF" --use-api
          done

      - name: Bootstrap and verify recovery schedules
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PRODUCTION_PROJECT_REF: ${{ secrets.SUPABASE_PRODUCTION_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN is required"; exit 1; }
          test -n "$SUPABASE_PRODUCTION_PROJECT_REF" || { echo "SUPABASE_PRODUCTION_PROJECT_REF is required"; exit 1; }
          npx supabase db query --linked 'select private.ensure_recovery_schedules();'
          npx supabase db query --linked 'select private.ensure_notification_outbox_schedule();'
          npx supabase db query --linked 'select private.ensure_weekly_report_refresh_schedule();'
          npx supabase db query --linked 'select private.assert_recovery_schedules_ready();'
          npx supabase db query --linked 'select private.assert_notification_outbox_schedule_ready();'
          npx supabase db query --linked 'select private.assert_weekly_report_refresh_schedule_ready();'

      - name: Install pinned DigitalOcean CLI action
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITAL_ACCESS_TOKEN }}

      - name: Deploy the tested main commit
        env:
          DIGITALOCEAN_APP_ID: ${{ secrets.DIGITAL_APP_ID }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test -n "$DIGITALOCEAN_APP_ID" || { echo "DIGITALOCEAN_APP_ID is required"; exit 1; }
          # `--wait` returns a non-zero status when App Platform's build fails.
          # Preserve and print its diagnostics instead of letting `bash -e` hide
          # the actual deployment error inside a command substitution.
          set +e
          deployment_json="$(doctl apps create-deployment "$DIGITALOCEAN_APP_ID" --wait --output json 2>&1)"
          deployment_status=$?
          set -e
          if [ "$deployment_status" -ne 0 ]; then
            echo 'DigitalOcean deployment request failed:' >&2
            echo "$deployment_json" >&2
            echo 'Most recent DigitalOcean deployments:' >&2
            doctl apps list-deployments "$DIGITALOCEAN_APP_ID" --output json >&2 || true
            exit "$deployment_status"
          fi
          deployment_id="$(jq -r 'if type == "array" then .[0].id else .id end' <<<"$deployment_json")"
          test -n "$deployment_id" && test "$deployment_id" != "null" || {
            echo 'DigitalOcean did not return a deployment ID.' >&2
            exit 1
          }

          deployed_sha="$(doctl apps get-deployment "$DIGITALOCEAN_APP_ID" "$deployment_id" --output json \
            | jq -r '.static_sites[]? | select(.name == "website") | .source_commit_hash // empty')"
          test -n "$deployed_sha" || {
            echo 'DigitalOcean did not report the website source commit.' >&2
            exit 1
          }
          test "$deployed_sha" = "$TESTED_SHA" || {
            echo "Deployment source mismatch: expected $TESTED_SHA, got $deployed_sha." >&2
            exit 1
          }

      - name: Deploy Cloudflare security edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORIGIN_URL: ${{ vars.CLOUDFLARE_ORIGIN_URL }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is required"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is required"; exit 1; }
          test -n "$ORIGIN_URL" || { echo "CLOUDFLARE_ORIGIN_URL is required"; exit 1; }
          npx --yes wrangler@4 deploy --config cloudflare/wrangler.toml --var "ORIGIN_URL:$ORIGIN_URL"

      - name: Verify deployed Supabase Edge Function JWT policy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PRODUCTION_PROJECT_REF: ${{ secrets.SUPABASE_PRODUCTION_PROJECT_REF }}
        run: npm run verify:edge-function-policy -- --production

      - name: Verify live production security headers
        env:
          PRODUCTION_ORIGINS: ${{ vars.PRODUCTION_ORIGINS }}
        run: npm run verify:production:headers
