name: Release Gates

on:
  # This is the release-quality status check configured as required for every
  # pull request. The same complete gate is re-run on main before deployment.
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: release-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: HUSKY=0 npm ci

      - name: Rollback plan check
        run: |
          node scripts/generate-rollback-plan.js
          node scripts/check-rollback-plan.js

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.5.4

      - name: Type-check Supabase Edge Functions
        run: |
          deno check --no-lock --node-modules-dir=none \
            supabase/functions/admin-invite-user/index.ts \
            supabase/functions/cleanup-submission-assets/index.ts \
            supabase/functions/complete-temporary-password/index.ts \
            supabase/functions/dispatch-notification-outbox/index.ts \
            supabase/functions/grade-submission/index.ts \
            supabase/functions/odie-careers-chat-stream/index.ts \
            supabase/functions/process-privacy-deletion/index.ts \
            supabase/functions/process-tutor-deletion/index.ts \
            supabase/functions/refresh-stale-weekly-reports/index.ts

      # `public-prerender.test.cjs` exercises the generated static shell and
      # needs Vite's ignored, content-hashed React output in a clean runner.
      - name: Build React assets for source-contract tests
        run: npm run build:react

      - name: Unit and source-contract tests
        run: npm test

      - name: Start local Supabase
        run: npm run supabase:start

      - name: Rebuild database from committed migrations
        run: |
          for attempt in 1 2 3; do
            if npm run supabase:reset; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Local Supabase reset failed; retrying after a short delay (attempt $attempt of 3)."
              sleep 10
            fi
          done
          exit 1

      - name: Verify canonical schema and SECURITY DEFINER guardrails
        run: |
          npm run supabase:docs:check
          npm run check:security-definer-search-path
          npm run verify:edge-function-policy

      - name: Run runtime RLS allow-and-deny matrix
        run: npm run test:rls:runtime

      - name: Verify generated Supabase type fingerprint
        run: npm run supabase:types:check

      - name: Dependency audit gate (prod)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Static asset budget
        run: npm run perf:budget

      - name: Monitoring assets validation
        run: npm run validate:monitoring

      - name: Install Playwright Chromium
        run: |
          # Do not use Ubuntu's chromium-browser package: it delegates to
          # Snap and makes this gate depend on Snapcraft availability.
          npx playwright install chromium
          CHROME_PATH=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")
          if [ ! -x "$CHROME_PATH" ]; then
            echo "Playwright Chromium executable not found after installation"
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> $GITHUB_ENV

      - name: Seed local Supabase and run real-auth role journeys
        run: npm run test:e2e:supabase

      - name: Run local Edge Function authorization matrix
        run: npm run test:edge:auth:runtime

      - name: Frontend mock smoke journeys
        run: npm run test:e2e

      - name: Canonical route QA and Lighthouse budgets
        env:
          CHROME_PATH: ${{ env.CHROME_PATH }}
          PUPPETEER_EXECUTABLE_PATH: ${{ env.CHROME_PATH }}
        run: |
          npm run qa:serve > /tmp/release-static-server.log 2>&1 &
          npm run qa:wait || { cat /tmp/release-static-server.log; exit 1; }
          curl -fsS http://localhost:8080/ > /dev/null || { cat /tmp/release-static-server.log; exit 1; }
          npm run qa:html
          npm run qa:links
          npm run qa:a11y
          npm run perf:lighthouse

      - name: Collect release evidence
        run: node scripts/collect-release-evidence.js

      - name: Validate release evidence
        run: node scripts/validate-release-evidence.js

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-gates-evidence
          path: releases/evidence/
          retention-days: 30

      - name: Release evidence summary
        run: |
          echo "Release evidence: releases/evidence/latest-release-gates.json" >> $GITHUB_STEP_SUMMARY
