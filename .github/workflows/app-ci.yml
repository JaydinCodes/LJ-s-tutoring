name: App CI

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies (lockfile-enforced)
        run: HUSKY=0 npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: HUSKY=0 npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Monitoring assets validation
        run: npm run validate:monitoring

  unit-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: HUSKY=0 npm ci

      # Some source-contract tests generate static HTML and therefore require
      # Vite's content-hashed React assets first. They must not rely on ignored
      # build output being present in a fresh checkout.
      - name: Build React assets for source-contract tests
        run: npm run build:react

      - name: Run unit tests (web helpers)
        run: npm test

  supabase-rls-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: HUSKY=0 npm ci

      - name: Start local Supabase
        run: npm run supabase:start

      - name: Rebuild database from committed migrations
        run: |
          for attempt in 1 2 3; do
            if npm run supabase:reset; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Local Supabase reset failed; retrying after a short delay (attempt $attempt of 3)."
              sleep 10
            fi
          done
          exit 1

      - name: Verify canonical schema and SECURITY DEFINER guardrails
        run: |
          npm run supabase:docs:check
          npm run check:security-definer-search-path
          npm run verify:edge-function-policy

      - name: Run runtime RLS allow-and-deny matrix
        run: npm run test:rls:runtime

      - name: Verify generated Supabase type fingerprint
        run: npm run supabase:types:check

      - name: Install Playwright Chromium
        run: npm run test:e2e:install

      - name: Run seeded local-Supabase role journeys
        run: npm run test:e2e:supabase

      - name: Run local Edge Function authorization matrix
        run: npm run test:edge:auth:runtime

  frontend-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: HUSKY=0 npm ci

      - name: Install Playwright Chromium
        run: npm run test:e2e:install

      # This is the deterministic browser smoke suite backed by the app's
      # in-memory E2E adapter. Runtime Supabase/RLS and seeded local-Supabase
      # journeys remain required in the separate database gate above.
      - name: Run frontend mock smoke journeys
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-smoke-playwright-report
          path: playwright-report/react/
          if-no-files-found: ignore
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: HUSKY=0 npm ci

      - name: Build
        run: npm run build

      - name: Enforce static asset budget
        run: npm run perf:budget
