name: Temporary PR 118 Supabase Snapshot Sync

on:
  push:
    branches:
      - codex/grade9-term1-sprint2-closure

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/grade9-term1-sprint2-closure

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: HUSKY=0 npm ci

      - name: Regenerate canonical schema inventory
        run: |
          npm run supabase:docs:update
          npm run supabase:docs:check

      - name: Start local Supabase
        run: npm run supabase:start

      - name: Rebuild local database from committed migrations
        run: npm run supabase:reset

      - name: Regenerate generated database types
        run: |
          npm run supabase:types:update
          npm run supabase:types:check

      - name: Verify SQL guardrails
        run: |
          npm run check:security-definer-search-path
          npm run verify:edge-function-policy

      - name: Run runtime database checks
        run: npm run test:rls:runtime

      - name: Commit updated generated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/supabase/SCHEMA_AND_POLICY_INVENTORY.md supabase/types/public.generated.ts
          if git diff --cached --quiet; then
            echo "Generated files already match."
            exit 0
          fi
          HUSKY=0 git commit -m "chore: sync Supabase schema inventory and generated types"
          git push origin HEAD:codex/grade9-term1-sprint2-closure
