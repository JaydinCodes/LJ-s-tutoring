name: Temporary PR 124 Grade 8 Bridge Schema Sync
on:
  push:
    branches:
      - codex/grade9-term1-sprint4-release-gate

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/grade9-term1-sprint4-release-gate
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: HUSKY=0 npm ci
      - name: Start disposable Supabase
        run: npm run supabase:start
      - name: Apply full migration chain
        run: npm run supabase:reset
      - name: Sync and check generated schema inventory
        run: |
          npm run supabase:docs:update
          npm run supabase:docs:check
      - name: Validate generated types and RLS
        run: |
          npm run supabase:types:check
          npm run test:rls:runtime
      - name: Commit canonical generated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/supabase/SCHEMA_AND_POLICY_INVENTORY.md
          if git diff --cached --quiet; then
            echo "Schema documentation already matches."
            exit 0
          fi
          HUSKY=0 git commit -m "chore: update schema inventory for Grade 8 bridge recommendation"
          git push origin HEAD:codex/grade9-term1-sprint4-release-gate
