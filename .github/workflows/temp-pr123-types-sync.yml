name: Temporary PR 123 Supabase Type Regeneration

on:
  push:
    branches:
      - codex/grade9-term1-sprint4-closure

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/grade9-term1-sprint4-closure

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: HUSKY=0 npm ci

      - name: Start local Supabase
        run: npm run supabase:start

      - name: Rebuild from all committed migrations
        run: npm run supabase:reset

      - name: Generate and verify database types
        run: |
          npm run supabase:types:update
          npm run supabase:types:check

      - name: Validate schema documentation and RLS
        run: |
          npm run supabase:docs:check
          npm run test:rls:runtime

      - name: Commit generated type snapshot to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/types/public.generated.ts
          if git diff --cached --quiet; then
            echo "Generated types already match."
            exit 0
          fi
          HUSKY=0 git commit -m "chore: regenerate Supabase types for Sprint 4 closure"
          git push origin HEAD:codex/grade9-term1-sprint4-closure
