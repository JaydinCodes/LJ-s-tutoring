name: Uptime Check

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  healthcheck:
    # Do not attach this scheduled probe to the protected production environment.
    # Protected environments can require deployment approval, which leaves cron
    # runs waiting until GitHub eventually expires them instead of probing uptime.
    runs-on: ubuntu-latest
    steps:
      - name: Check out monitoring probes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Check health endpoint
        id: health
        env:
          # Repository variables can override these public production defaults.
          # The Supabase anon key is browser-public and already committed in the
          # deployment config, so a repository secret/variable is optional here.
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL || 'https://projectodysseus.live' }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://jscrgpwyniphagitliuz.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzY3JncHd5bmlwaGFnaXRsaXV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MjAwMDgsImV4cCI6MjA5NTM5NjAwOH0.W--APZ5jnNK7tzUtlwl91YJnt8ZL6_Op5AYQ8GysPsM' }}
          PRODUCTION_ORIGINS: ${{ vars.PRODUCTION_ORIGINS || 'https://projectodysseus.live,https://admin.projectodysseus.live,https://tutor.projectodysseus.live,https://student.projectodysseus.live' }}
        run: |
          missing=()
          for name in HEALTHCHECK_URL SUPABASE_URL SUPABASE_ANON_KEY PRODUCTION_ORIGINS; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Missing required production configuration: ${missing[*]}" >&2
            exit 1
          fi

          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT

          curl --fail --show-error --silent --retry 2 --retry-delay 2 --max-time 15 \
            -H 'Accept: application/json' \
            --dump-header "$headers" \
            --output "$body" \
            "${HEALTHCHECK_URL%/}/health.json"
          grep --ignore-case --quiet '^content-type:.*application/json' "$headers"
          jq -e '
            type == "object" and
            keys == ["service", "status", "version"] and
            .status == "ok" and
            .service == "project-odysseus-web" and
            .version == "1"
          ' "$body" > /dev/null

          curl --fail --show-error --silent --retry 2 --retry-delay 2 --max-time 15 \
            -H 'Accept: application/json' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "${SUPABASE_URL%/}/auth/v1/health" > /dev/null

          curl --fail --show-error --silent --retry 2 --retry-delay 2 --max-time 15 \
            -H 'Accept: application/json' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H 'Content-Type: application/json' \
            --data '{}' \
            "${SUPABASE_URL%/}/rest/v1/rpc/monitoring_health_probe" | \
            jq -e 'type == "array" and length == 1 and .[0].status == "ok"' > /dev/null

          npm run verify:production:headers
      - name: Create or update issue on failure
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const title = 'Uptime check failed';
            const body = `The scheduled uptime check failed at ${new Date().toISOString()}.

            Please verify the exact /health.json contract, Supabase Auth health, the data-free PostgREST monitoring RPC, and production repository configuration.

            Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
