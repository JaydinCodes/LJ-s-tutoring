# Temporary one-off repair for PR #115. Remove after the generated snapshot is committed.
name: Temporary Supabase types sync for PR 115

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate-reviewed-types:
    if: github.event.pull_request.number == 115 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'work'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install locked dependencies
        run: HUSKY=0 npm ci

      - name: Start local Supabase and apply committed migrations
        run: |
          npm run supabase:start
          npm run supabase:reset

      - name: Generate current schema-derived TypeScript snapshot
        run: npm run supabase:types:update

      - name: Commit only the generated snapshot to the PR branch
        run: |
          git add supabase/types/public.generated.ts
          if git diff --cached --quiet; then
            echo "Generated Supabase snapshot is already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: sync Supabase generated types with learning migrations'
          git push origin HEAD:refs/heads/work
