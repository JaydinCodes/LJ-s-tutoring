# SECURITY HEADERS: intentionally NOT configured here via `secure_header`.
# `ingress.rules[].secure_header` (key/value/remove_header) is a real App Spec
# field, but per DigitalOcean's own reference docs its `key`/`value` gate
# *incoming* requests -- "Block all incoming HTTP requests that do not include
# the required header" -- it is not a mechanism for setting outbound response
# headers like Content-Security-Policy, X-Frame-Options, X-Content-Type-Options,
# Referrer-Policy, or Strict-Transport-Security. (Verified directly against
# digitalocean/openapi's app_ingress_spec_rule.yml, which only defines `match`,
# `cors`, `component`, `redirect` for a rule -- no header-injection field -- and
# against docs.digitalocean.com/products/app-platform/reference/app-spec/,
# 2026-07.) As of this writing, App Platform's `static_sites` component type has
# no supported app-spec mechanism to set arbitrary response headers at all; this
# is an open DigitalOcean feature request (see "Add Response Headers to Static
# Site" / "Static site headers and routing" on ideas.digitalocean.com). The only
# documented workaround is to move the header-needing route to a `services`
# (backend) component, which is out of scope here since lms-api is retired and
# this app is static-sites-only.
#
# Partial, file-only mitigation applied instead (see index.html and
# scripts/build-static.js): a <meta http-equiv="Content-Security-Policy"> tag
# and a <meta name="referrer"> tag are baked into every generated HTML shell.
# Both work via <meta> per the CSP and Referrer-Policy specs. This does NOT
# cover X-Frame-Options, X-Content-Type-Options, or Strict-Transport-Security --
# none of those have a <meta> equivalent, and CSP's frame-ancestors directive is
# explicitly ignored when delivered via <meta> (browsers only honor it on the
# real HTTP header), so clickjacking protection remains an open gap until this
# app either gets a proxy/service layer in front of it or DO ships static-site
# response headers.
ingress:
  rules:
    - match:
        authority:
          exact: admin.projectodysseus.live
        path:
          prefix: /assets
      component:
        name: website
        preserve_path_prefix: true
