static_sites:
  - name: website
    # --include=dev overrides NODE_ENV=production (set above, RUN_AND_BUILD_TIME
    # scope) which otherwise makes `npm ci` skip devDependency-only packages --
    # autoprefixer is the only build-toolchain package with no transitive path
    # from a regular dependency, so it's the one that silently goes missing.
    build_command: npm ci --include=dev && npm run build
    output_dir: dist
    github:
      repo: JaydinCodes/LJ-s-tutoring
      branch: main
      deploy_on_push: true
    catchall_document: index.html
    environment_slug: html
    envs:
      - key: PUBLIC_PO_API_BASE
        scope: BUILD_TIME
        value: /api
      - key: ASSISTANT_ENABLED
        scope: BUILD_TIME
        value: "true"
      # Literal values -- see the note on the app-level entries above for why
      # the ${VAR} form is deliberately not used here.
      - key: VITE_SUPABASE_URL
        scope: BUILD_TIME
        value: https://jscrgpwyniphagitliuz.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        scope: BUILD_TIME
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzY3JncHd5bmlwaGFnaXRsaXV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MjAwMDgsImV4cCI6MjA5NTM5NjAwOH0.W--APZ5jnNK7tzUtlwl91YJnt8ZL6_Op5AYQ8GysPsM
