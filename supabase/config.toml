project_id = "project-odysseus-local"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55432
shadow_port = 55430
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/dashboard/login/",
  "http://localhost:8080/dashboard/login/"
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Disabled: the local analytics (Logflare) sidecar container fails its health
# check on Windows without a TCP-exposed Docker daemon (a documented Supabase
# CLI limitation, not specific to this project) and isn't needed for local
# dev/RLS testing.
[analytics]
enabled = false

[functions.process-privacy-deletion]
enabled = true
verify_jwt = false
import_map = "./functions/process-privacy-deletion/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/process-privacy-deletion/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/process-privacy-deletion/*.html" ]

[functions.process-tutor-deletion]
enabled = true
# Authorization is verified in the function, so scheduled retries can use the
# service-role bearer token and administrators can use their normal JWT.
verify_jwt = false
import_map = "./functions/process-tutor-deletion/deno.json"
entrypoint = "./functions/process-tutor-deletion/index.ts"

[functions.grade-submission]
enabled = true
verify_jwt = true
entrypoint = "./functions/grade-submission/index.ts"

[functions.cleanup-submission-assets]
enabled = true
verify_jwt = true
entrypoint = "./functions/cleanup-submission-assets/index.ts"

[functions.dispatch-notification-outbox]
enabled = true
verify_jwt = true
entrypoint = "./functions/dispatch-notification-outbox/index.ts"

[functions.refresh-stale-weekly-reports]
enabled = true
verify_jwt = true
entrypoint = "./functions/refresh-stale-weekly-reports/index.ts"

# Authentication is explicit for every non-public function. The handlers also
# validate role/status and, for internal workers, the exact service-role key.
[functions.odie-careers-chat-stream]
enabled = true
verify_jwt = true
entrypoint = "./functions/odie-careers-chat-stream/index.ts"

[functions.admin-invite-user]
enabled = true
verify_jwt = true
entrypoint = "./functions/admin-invite-user/index.ts"

[functions.complete-temporary-password]
enabled = true
verify_jwt = true
entrypoint = "./functions/complete-temporary-password/index.ts"
